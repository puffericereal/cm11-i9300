name: Archive CM11 source

on:
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release

env:
  BRANCH: cm-11.0
  WORK: /mnt/cm11
  GIT_TERMINAL_PROMPT: "0"

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: free disk space & prepare work dir
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo mkdir -p "$WORK" /mnt/parts
          sudo chown "$(id -un):$(id -gn)" "$WORK" /mnt/parts
          df -h / /mnt

      - name: config git & install repo
        run: |
          git config --global user.name "BuildBot"
          git config --global user.email "buildbot@example.com"
          git config --global color.ui false
          git config --global url."https://github.com/".insteadOf "git://github.com/"

          sudo curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o /usr/local/bin/repo
          sudo chmod a+rx /usr/local/bin/repo

      - name: sync the CM11 src
        run: |
          cd "$WORK"
          repo init -u https://github.com/LineageOS/android.git -b "$BRANCH" --depth=1

          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/i9300.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="lineage-gh" fetch="https://github.com/LineageOS" />
            <remote name="muppets-gh" fetch="https://github.com/TheMuppets" />

            <project name="android_device_samsung_i9300"          path="device/samsung/i9300"          remote="lineage-gh" revision="cm-11.0" />
            <project name="android_device_samsung_smdk4412-common" path="device/samsung/smdk4412-common" remote="lineage-gh" revision="cm-11.0" />
            <project name="android_kernel_samsung_smdk4412"        path="kernel/samsung/smdk4412"        remote="lineage-gh" revision="cm-11.0" />
            <project name="android_hardware_samsung"               path="hardware/samsung"               remote="lineage-gh" revision="cm-11.0" />
            <project name="android_packages_apps_SamsungServiceMode" path="packages/apps/SamsungServiceMode" remote="lineage-gh" revision="cm-11.0" />
            <project name="proprietary_vendor_samsung"             path="vendor/samsung"                 remote="muppets-gh" revision="cm-11.0" />
          </manifest>
          EOF

          cat > "$RUNNER_TEMP/resolve_deps.py" <<'EOF'
          import glob, json, os, sys
          import xml.etree.ElementTree as ET

          BRANCH = os.environ["BRANCH"]
          OUT = ".repo/local_manifests/deps.xml"

          root = ET.parse(OUT).getroot() if os.path.exists(OUT) else ET.Element("manifest")
          known = {p.get("path") for p in root.iter("project")}
          added = []

          for dep_file in sorted(glob.glob("device/*/*/*.dependencies")):
              with open(dep_file) as f:
                  deps = json.load(f)
              for dep in deps:
                  path = dep["target_path"]
                  name = dep["repository"]
                  if "/" in name:
                      org, name = name.split("/", 1)
                      if org != "LineageOS":
                          print(f"::warning::skipping {org}/{name}")
                          continue
                  if path in known or os.path.isdir(path):
                      continue
                  ET.SubElement(root, "project", name=name, path=path,
                                remote="lineage-gh", revision=dep.get("branch", BRANCH))
                  known.add(path)
                  added.append(path)

          if added:
              ET.indent(root)
              ET.ElementTree(root).write(OUT, encoding="utf-8", xml_declaration=True)
              print("Added missing dependencies:", *added, sep="\n  ")
              sys.exit(10)
          print("All dependencies are present.")
          EOF

          sync_all() {
            for try in 1 2 3; do
              repo sync -c --no-clone-bundle --no-tags --force-sync -j4 && return 0
              echo "repo sync failed (try $try of 3), retrying in 30 s..."
              sleep 30
            done
            return 1
          }

          sync_all
          for round in 1 2 3 4 5; do
            rc=0
            python3 "$RUNNER_TEMP/resolve_deps.py" || rc=$?
            if [ "$rc" -eq 0 ]; then break; fi
            if [ "$rc" -ne 10 ]; then exit "$rc"; fi
            sync_all
          done

          ls hardware/samsung/exynos4x12.mk
          df -h /mnt

      - name: fetch CM prebuilts
        run: |
          cd "$WORK"
          sh vendor/cm/get-prebuilts || echo "::warning::get-prebuilts failed"
          { grep -rhoE 'vendor/cm/proprietary/[A-Za-z0-9_./-]*\.[A-Za-z0-9]+' vendor/cm/config || true; } \
            | sort -u | while read -r f; do
              if [ ! -d "$f" ] && [ ! -s "$f" ]; then
                mkdir -p "$(dirname "$f")"
                : > "$f"
                echo "::warning::$f is missing, created an empty placeholder"
              fi
            done

      - name: pack into release-sized parts
        run: |
          cd "$WORK"
          # exact commit of every repo, so this snapshot can be rebuilt later
          repo manifest -r -o /mnt/parts/pinned-manifest.xml

          # whole tree (including .repo) -> tar -> zstd -> pieces under 2 GiB each
          tar --exclude=./out -cf - . \
            | zstd -T0 -3 \
            | split -b 1900M -d -a 3 - /mnt/parts/cm11-src.tar.zst.part-

          cd /mnt/parts
          sha256sum cm11-src.tar.zst.part-* pinned-manifest.xml > SHA256SUMS
          ls -lh /mnt/parts
          df -h /mnt

      - name: publish as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="cm11-src-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" /mnt/parts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "CM11 source snapshot $TAG" \
            --notes "Full CM11 (cm-11.0) i9300 source tree. Join the parts with: cat cm11-src.tar.zst.part-* | zstd -d | tar -x"
            
